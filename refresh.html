<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245c4b">
  <meta name="robots" content="noindex">
  <title>ことばの記録を最新版に更新</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#293c35;background:#f6f5f0}*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center}.card{width:min(100%,520px);background:#fffefa;border:1px solid #dedfd6;border-radius:16px;padding:28px;box-shadow:0 8px 30px #293c350d}h1{font-size:23px;margin:0 0 16px}p{line-height:1.8;color:#68766c;font-size:14px}button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:9px;background:#245c4b;color:white;font:700 15px inherit;padding:14px;cursor:pointer}button:disabled{opacity:.6}#status{min-height:24px;color:#245c4b;font-weight:600}
  </style>
</head>
<body>
  <main class="card">
    <h1>アプリを最新版に更新</h1>
    <p>古いオフライン画面だけを入れ替えます。単語、累積誤答、学習履歴、Google Sheetsの同期設定は消えません。</p>
    <button id="refresh" type="button">最新版に更新する</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('refresh').addEventListener('click', async event => {
      const button = event.currentTarget, status = document.getElementById('status');
      button.disabled = true; status.textContent = '更新しています…';
      try {
        const scope = new URL('./', location.href);
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(item => item.scope === scope.href).map(item => item.unregister()));
        }
        const prefix = `kotoba-shell:${scope.pathname}:`;
        await Promise.all((await caches.keys()).filter(key => key.startsWith(prefix)).map(key => caches.delete(key)));
        location.replace(`./?updated=${Date.now()}`);
      } catch (error) {
        status.textContent = `更新できませんでした：${error.message}`; button.disabled = false;
      }
    });
  </script>
</body>
</html>
